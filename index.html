<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="images/icon/app_icon.png">

    <title>Smart Octopus</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <a id="github" href="https://github.com/mgiesen/Smart-Octopus" aria-label="GitHub Repository"></a>

    <div id="app">

        <div id="page_title">

            <div class="difficulty_wrapper">
                <h1 id="difficulty">Smart</h1>
                <h1>Octopus</h1>
            </div>

            <div class="octopus_icon_wrapper">
                <img src="images/left.svg" id="prev_difficulty" alt="Previous difficulty">
                <img src="images/logo.svg" alt="Smart Octopus Logo">
                <img src="images/right.svg" id="next_difficulty" alt="Next difficulty">
            </div>

            <div id="difficulty_indicator"></div>

        </div>

        <div id="digits"></div>

        <div id="touch_input">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div id="status_wrapper">
                <img id="status_icon" alt="Game status">
                <div id="progress_indicator"></div>
            </div>
            <div>0</div>
            <div>
                <img id="btn_start" src="images/start.svg" alt="Start game">
            </div>
        </div>

    </div>

    <script src="js/game.js"></script>

</body>

</html>
